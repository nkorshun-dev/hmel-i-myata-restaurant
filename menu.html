<body data-page="menu">
<header class="header" id="site-header"></header>
<main id="main">
<section class="wrap pagehead">
  <p class="eyebrow">Меню</p>
  <h1>Кухня и кран</h1>
  <p class="lead">Отметьте, что вам подходит, и уберите то, что нельзя. Фильтры сохраняются в адресе страницы, ими можно поделиться.</p>
</section>

<section class="wrap filters" aria-label="Фильтры меню">
  <div class="filters__row">
    <label class="search"><span class="sr-only">Поиск по названию и составу</span><input type="search" id="q" placeholder="Поиск: драники, утка, грибы" autocomplete="off"></label>
  </div>
  <div class="filters__group"><p class="filters__h" id="fh1">Показать только</p><div class="chips" id="tag-chips" role="group" aria-labelledby="fh1"></div></div>
  <div class="filters__group"><p class="filters__h" id="fh2">Исключить аллергены</p><div class="chips" id="allergen-chips" role="group" aria-labelledby="fh2"></div></div>
  <div class="filters__foot"><p id="count" class="muted" role="status" aria-live="polite"></p><button type="button" class="link-btn" id="reset" hidden>Сбросить фильтры</button></div>
</section>

<nav class="catnav" id="catnav" aria-label="Категории меню"></nav>

<div class="wrap" id="menu-list"></div>

<section class="wrap section" id="beer" aria-labelledby="beer-h">
  <p class="eyebrow">14 кранов</p>
  <h2 id="beer-h">Пиво на кране</h2>
  <p class="muted">Фильтры выше относятся к блюдам. Цены за 0,3 и 0,5 л, BYN.</p>
  <div class="grid grid--beer" id="beer-list"></div>
</section>
</main>
<footer class="footer" id="site-footer"></footer>
<script type="module" src="js/menu.js"></script>
